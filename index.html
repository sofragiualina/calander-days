<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Days Calendar</title>
  <script type="module" src="web.mjs"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <h1>Days Calendar</h1>

    <section aria-labelledby="month-year">
      <div class="calendar-controls">
        <button id="previous-month" type="button">Previous</button>

        <h2 id="month-year" aria-live="polite"></h2>

        <button id="next-month" type="button">Next</button>

        <label for="month-select">Month</label>
        <select id="month-select">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>

        <label for="year-select">Year</label>
        <input id="year-select" type="number" min="100" max="9999" step="1" />
      </div>

      <div class="weekdays">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div id="calendar-grid"></div>

    </section>
  </main>
</body>

</html>
